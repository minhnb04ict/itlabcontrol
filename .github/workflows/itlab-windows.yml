# ITLabControl - build bộ cài Windows bằng MSYS2 UCRT64
#
# - Mỗi lần push / pull request: build và đính kèm bộ cài vào trang của lần chạy (Artifacts).
# - Mỗi lần push tag dạng vX.Y.Z: tạo thêm GitHub Release chứa bộ cài.
#
# Các bước giống hệt docs/BUILD.md.

name: "ITLabControl Windows build"

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Phiên bản Interception đã kiểm chứng (oblitum/Interception)
  INTERCEPTION_COMMIT: 39eecbbc46a52e0402f783b872ef62b0254a896a

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cài MSYS2 và thư viện
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-httpserver
            mingw-w64-ucrt-x86_64-qca-qt6
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lzo2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-openldap
            mingw-w64-ucrt-x86_64-cyrus-sasl
            mingw-w64-ucrt-x86_64-libvncserver
            mingw-w64-ucrt-x86_64-nsis

      - name: Build thư viện Interception
        run: |
          git clone https://github.com/oblitum/Interception.git /tmp/Interception
          cd /tmp/Interception && git checkout "$INTERCEPTION_COMMIT"
          cd library
          gcc -O2 -shared -DINTERCEPTION_EXPORT -o interception.dll interception.c \
            -Wl,--out-implib,libinterception.dll.a
          cp interception.dll /ucrt64/bin/
          cp libinterception.dll.a /ucrt64/lib/
          cp interception.h /ucrt64/include/

      - name: Cấu hình (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWITH_LTO=OFF \
            -DWITH_TRANSLATIONS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Đóng gói bộ cài
        run: bash scripts/msys2/package.sh build --installer

      - name: Kiểm tra nhanh thư mục đóng gói
        shell: cmd
        run: |
          cd build\package
          veyon-cli.exe about
          veyon-cli.exe plugin list

      - name: Đính kèm bộ cài vào lần chạy
        uses: actions/upload-artifact@v4
        with:
          name: itlabcontrol-windows-installer
          path: build/itlabcontrol-*-setup.exe
          if-no-files-found: error

      - name: Tạo GitHub Release (khi push tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/itlabcontrol-*-setup.exe
          generate_release_notes: true
